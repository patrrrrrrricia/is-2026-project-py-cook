{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADD RECIPE - PyCook</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="icon" href="{% static 'images/pycook.png' %}" type="image/png">
</head>
<body>

    <header class="navbar">
        <div class="logo">PyCook</div>
        <nav>
            <a href="{% url 'home' %}">HOME</a>
            <a href="{% url 'search_ingredients' %}">SEARCH INGREDIENTS</a>
            <a href="{% url 'add_recipe' %}">ADD RECIPE</a>
            <a href="{% url 'register' %}">REGISTER</a>
            <a href="{% url 'login' %}" class="btn-login">LOGIN</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="home-container">
            <h1 style="color: #3B2F2A; font-size: 2rem; margin-bottom: 10px;">Adauga o reteta noua</h1>
            <p class="subtitle">Impartaseste preparatul tau preferat cu intreaga echipa.</p>

            <div class="card" style="margin: 0 auto; width: 100%; max-width: 500px; min-height: auto; padding: 30px; gap: 25px;">
                <form method="POST" style="width: 100%; display: flex; flex-direction: column; gap: 20px;">
                    {% csrf_token %}

                    <div class="inputBox" style="width: 100%;">
                        <input type="text" name="recipe_name" required="required">
                        <span>Nume reteta</span>
                    </div>

                    <div class="inputBox" style="width: 100%;">
                        <input type="text" name="calories" required="required">
                        <span>Calorii (kcal)</span>
                    </div>

                    <div class="inputBox" style="width: 100%;">
                        <input type="text" name="ingredients" required="required">
                        <span>Ingrediente necesare</span>
                    </div>

                    <button class="enter" type="submit" style="width: 100%; margin-top: 20px; margin-bottom: 0;">Salveaza reteta</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PyCook - Emilia - Iuliana - Gabriela - Patricia</p>
    </footer>

</body>
</html>
