{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEARCH INGREDIENTS - PyCook</title>

    <!-- legatura statica pentru CSS in Django -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- meniul de sus -->
    <header class="navbar">
        <div class="logo">PyCook</div>
        <nav>
            <a href="{% url 'home' %}">HOME</a>
            <a href="{% url 'search_ingredients' %}">SEARCH INGREDIENTS</a>
            <a href="{% url 'add_recipe' %}">ADD RECIPE</a>
            <a href="{% url 'register' %}">REGISTER</a>
            <a href="{% url 'login' %}" class="btn-login">LOGIN</a>
        </nav>
    </header>

    <!-- continutul principal -->
    <main class="main-content">
        <div class="home-container">
            <h1 style="color: #3B2F2A; font-size: 2rem; margin-bottom: 10px;">Ce ai prin frigider?</h1>
            <p class="subtitle">Introdu ingredientele separate prin virgula si descopera retete rapide.</p>

            <!-- cardul interactiv pentru căutare -->
            <div class="card" style="margin: 0 auto; width: 100%; max-width: 450px; min-height: auto; padding: 40px;">
                <form method="GET" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <div class="inputBox" style="width: 100%; margin-bottom: 20px;">
                        <input type="text" name="ingredients" required="required">
                        <span>Ingrediente (ex: oua, branza)</span>
                    </div>
                    <button class="enter" type="submit" style="width: 100%; margin-top: 10px; margin-bottom: 0;">Cauta retete</button>
                </form>
            </div>
        </div>
    </main>

    <!-- subsolul paginii -->
    <footer>
        <p>&copy; 2026 PyCook - Emilia - Iuliana - Gabriela - Patricia</p>
    </footer>

</body>
</html>
